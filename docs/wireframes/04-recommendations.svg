8" font-weight="700">Picks from this shelf</text><text x="48" y="214" font-size="11.5" fill="#656d76">Recommended lens · setting Middle · against your seeds</text><rect x="44" y="228" width="332" height="150" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="58" y="254" font-size="18" fill="#0969da" font-weight="700">1</text><text x="82" y="253" font-size="14" fill="#1f2328" font-weight="700">Glass Orchard</text><text x="82" y="271" font-size="11" fill="#656d76">T. Okafor · band probable · MIDDLE</text><text x="58" y="294" font-size="11.5" fill="#1f2328">Shares drowned cities (seed: A. Mirren)</text><text x="58" y="311" font-size="11.5" fill="#1f2328">and slow institutions (seed: P. Lund).</text><rect x="58" y="320" width="96" height="22" rx="11" fill="none" stroke="#0969da" stroke-width="1"/><text x="106" y="335" font-size="11" fill="#0969da" font-weight="600" text-anchor="middle">Show on shelf</text><rect x="162" y="320" width="82" height="22" rx="11" fill="none" stroke="#d0d7de" stroke-width="1"/><text x="203" y="335" font-size="11" fill="#656d76" text-anchor="middle">Not for me</text><rect x="58" y="350" width="304" height="20" rx="4" fill="#fff8c5"/><text x="66" y="364" font-size="10.5" fill="#9a6700" font-weight="600">Revised: was #2, now #1 · title confirmed</text><text x="354" y="364" font-size="10.5" fill="#0969da" font-weight="700" text-anchor="end">Undo</text><rect x="44" y="392" width="332" height="118" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="58" y="418" font-size="18" fill="#0969da" font-weight="700">2</text><text x="82" y="417" font-size="14" fill="#1f2328" font-weight="700">Copper Weather</text><text x="82" y="435" font-size="11" fill="#656d76">J. Sato · band verified · SIDEWAYS</text><text x="58" y="458" font-size="11.5" fill="#1f2328">Keeps your theme, the archive as memory,</text><text x="58" y="475" font-size="11.5" fill="#1f2328">in a different form: letters and logs.</text><rect x="58" y="484" width="96" height="22" rx="11" fill="none" stroke="#0969da" stroke-width="1"/><text x="106" y="499" font-size="11" fill="#0969da" font-weight="600" text-anchor="middle">Show on shelf</text><rect x="162" y="484" width="82" height="22" rx="11" fill="none" stroke="#d0d7de" stroke-width="1"/><text x="203" y="499" font-size="11" fill="#656d76" text-anchor="middle">Not for me</text><rect x="44" y="524" width="332" height="118" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="58" y="550" font-size="18" fill="#0969da" font-weight="700">3</text><text x="82" y="549" font-size="14" fill="#1f2328" font-weight="700">The Tide Clerk</text><text x="82" y="567" font-size="11" fill="#656d76">M. Brandt · band candidate · FARTHER</text><text x="58" y="590" font-size="11.5" fill="#1f2328">Holds one idea of yours, salvage, and</text><text x="58" y="607" font-size="11.5" fill="#1f2328">departs on style and setting.</text><rect x="58" y="616" width="96" height="22" rx="11" fill="none" stroke="#0969da" stroke-width="1"/><text x="106" y="631" font-size="11" fill="#0969da" font-weight="600" text-anchor="middle">Show on shelf</text><rect x="162" y="616" width="82" height="22" rx="11" fill="none" stroke="#d0d7de" stroke-width="1"/><text x="203" y="631" font-size="11" fill="#656d76" text-anchor="middle">Not for me</text><text x="210" y="672" font-size="11" fill="#656d76" text-anchor="middle">Cards revise in batches, never mid-glance; every revision</text><text x="210" y="688" font-size="11" fill="#656d76" text-anchor="middle">says what it was, what it is and why (INV-21, INV-24).</text><text x="210" y="716" font-size="11" fill="#656d76" text-anchor="middle" font-style="italic">Taste ranks picks; it never decides identity (INV-13).</text></g>
