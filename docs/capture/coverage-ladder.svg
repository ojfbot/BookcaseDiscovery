<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" width="840" height="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Q-0 coverage ladder and monotone rule, illustrative">
<title>Q-0 · Coverage ladder and the monotone rule (illustrative)</title>
<defs>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="rgba(252,251,246,0.10)"/><line x1="0" y1="0" x2="0" y2="7" stroke="rgba(252,251,246,0.75)" stroke-width="2"/></pattern>
<pattern id="hatchInk" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#574f44" stroke-width="2"/></pattern>
</defs>
<rect x="0" y="0" width="840" height="540" fill="#ffffff"/>
<rect x="0" y="0" width="840" height="30" fill="#fff8c5"/><text x="12" y="19.5" font-size="10.5" fill="#9a6700" font-weight="700">ILLUSTRATIVE · PRE-RULING · SYNTHETIC SHELVES</text><text x="828" y="19.5" font-size="10.5" fill="#9a6700" text-anchor="end">Q-0 · coverage ladder</text>
<text x="24" y="62" font-size="15" font-weight="800" fill="#17140f">The ladder: what each rung shows on glass</text><rect x="24" y="84" width="44" height="38" fill="#52b083" opacity="0.75" stroke="#574f44" stroke-width="1" /><text x="80" y="100" font-size="12" font-family="'JetBrains Mono', Menlo, monospace" font-weight="800" fill="#17140f">confirmed</text><text x="80" y="115" font-size="9" font-family="'JetBrains Mono', Menlo, monospace" fill="#574f44">band probable / verified · resolved · F-0 catalog-confirmed</text><rect x="24" y="134" width="44" height="38" fill="#52b083" opacity="0.75" stroke="#574f44" stroke-width="1" /><text x="80" y="150" font-size="12" font-family="'JetBrains Mono', Menlo, monospace" font-weight="800" fill="#17140f">matched</text><text x="80" y="165" font-size="9" font-family="'JetBrains Mono', Menlo, monospace" fill="#574f44">band candidate · F-0 single-reader, readers-disagree</text><rect x="24" y="184" width="44" height="38" fill="#52b083" opacity="0.75" stroke="#574f44" stroke-width="1" /><text x="80" y="200" font-size="12" font-family="'JetBrains Mono', Menlo, monospace" font-weight="800" fill="#17140f">text-read</text><text x="80" y="215" font-size="9" font-family="'JetBrains Mono', Menlo, monospace" fill="#574f44">readers' strings agree, or a catalog bar passed</text><rect x="24" y="234" width="44" height="38" fill="url(#hatchInk)" stroke="#574f44" stroke-width="1" /><text x="80" y="250" font-size="12" font-family="'JetBrains Mono', Menlo, monospace" font-weight="800" fill="#17140f">text-present</text><text x="80" y="265" font-size="9" font-family="'JetBrains Mono', Menlo, monospace" fill="#574f44">some text, uncorroborated · missing-pixels</text><rect x="24" y="284" width="44" height="38" fill="url(#hatchInk)" stroke="#574f44" stroke-width="1" /><text x="80" y="300" font-size="12" font-family="'JetBrains Mono', Menlo, monospace" font-weight="800" fill="#17140f">spine-found</text><text x="80" y="315" font-size="9" font-family="'JetBrains Mono', Menlo, monospace" fill="#574f44">box or stable track, no text · needs-pixels</text><rect x="24" y="334" width="44" height="38" fill="url(#hatchInk)" stroke="#574f44" stroke-width="1" /><text x="80" y="350" font-size="12" font-family="'JetBrains Mono', Menlo, monospace" font-weight="800" fill="#17140f">seen</text><text x="80" y="365" font-size="9" font-family="'JetBrains Mono', Menlo, monospace" fill="#574f44">covered (COVER rule), no spine here · gap</text><rect x="24" y="384" width="44" height="38" fill="none" stroke="#574f44" stroke-width="1" stroke-dasharray="3 2"/><text x="80" y="400" font-size="12" font-family="'JetBrains Mono', Menlo, monospace" font-weight="800" fill="#17140f">not-seen</text><text x="80" y="415" font-size="9" font-family="'JetBrains Mono', Menlo, monospace" fill="#574f44">no usable frame yet</text><line x1="18" y1="228" x2="400" y2="228" stroke="#17140f" stroke-width="3"/><text x="400" y="242" font-size="9" font-family="'JetBrains Mono', Menlo, monospace" font-weight="800" fill="#17140f" text-anchor="end">FILL LINE · capture's job ends here</text><text x="24" y="448" font-size="9.5" font-family="'JetBrains Mono', Menlo, monospace" fill="#574f44">Above the line: catalog (C-R), adjudicator (I-4),</text><text x="24" y="463" font-size="9.5" font-family="'JetBrains Mono', Menlo, monospace" fill="#574f44">tap (U-3 002). The lenses show it.</text><text x="24" y="482" font-size="9.5" font-family="'JetBrains Mono', Menlo, monospace" fill="#574f44">Below it: closer, slower, less glare, another angle.</text><text x="450" y="62" font-size="15" font-weight="800" fill="#17140f">One segment over time: calm, monotone</text><rect x="450" y="96" width="360" height="220" fill="#f2efe7"/><line x1="450" y1="162" x2="810" y2="162" stroke="#7d7466" stroke-width="1" stroke-dasharray="4 3"/><text x="806" y="158" font-size="8.5" font-family="'JetBrains Mono', Menlo, monospace" fill="#574f44" text-anchor="end">FILL_P 0.7</text><path d="M450.0,301.0 L456.0,308.1 L462.0,296.2 L468.0,309.8 L474.0,307.9 L480.0,300.2 L486.0,296.8 L492.0,299.6 L498.0,275.5 L504.0,251.8 L510.0,237.1 L516.0,239.9 L522.0,218.0 L528.0,227.5 L534.0,200.6 L540.0,194.0 L546.0,200.9 L552.0,166.7 L558.0,170.6 L564.0,148.7 L570.0,142.5 L576.0,138.0 L582.0,145.6 L588.0,137.8 L594.0,136.8 L600.0,138.9 L606.0,139.3 L612.0,145.4 L618.0,147.8 L624.0,133.3 L630.0,141.2 L636.0,148.8 L642.0,152.7 L648.0,149.0 L654.0,170.0 L660.0,170.4 L666.0,185.9 L672.0,190.7 L678.0,192.3 L684.0,173.9 L690.0,179.5 L696.0,145.9 L702.0,145.8 L708.0,151.7 L714.0,141.8 L720.0,145.0 L726.0,151.4 L732.0,148.9 L738.0,137.2 L744.0,144.7 L750.0,129.3 L756.0,134.9 L762.0,130.6 L768.0,129.3 L774.0,139.6 L780.0,152.5 L786.0,145.7 L792.0,150.7 L798.0,150.1 L804.0,151.9 L810.0,143.0" fill="none" stroke="#2f6b86" stroke-width="1.6"/><text x="458" y="112" font-size="8.5" font-family="'JetBrains Mono', Menlo, monospace" fill="#2f6b86">predicted P(text-read), per frame</text><rect x="450" y="334" width="43.199999999999996" height="26" fill="none" stroke="#574f44" stroke-dasharray="3 2"/><rect x="493.2" y="334" width="64.8" height="26" fill="url(#hatchInk)" stroke="#574f44" stroke-width="0.6"/><rect x="558" y="334" width="187.20000000000002" height="26" fill="#52b083" opacity="0.75"/><rect x="745.2" y="334" width="64.80000000000001" height="26" fill="#52b083" opacity="0.75"/><rect x="749.2" y="338" width="56.80000000000001" height="18" fill="#b81a12"/><text x="777.6" y="350" font-size="7.5" font-family="'JetBrains Mono', Menlo, monospace" font-weight="800" fill="#fff" text-anchor="middle">CLOSER LOOK</text><text x="450" y="376" font-size="9" font-family="'JetBrains Mono', Menlo, monospace" fill="#17140f">GLASS</text><line x1="493.2" y1="96" x2="493.2" y2="360" stroke="#17140f" stroke-width="0.8" stroke-dasharray="2 2"/><text x="450" y="400" font-size="9" font-family="'JetBrains Mono', Menlo, monospace" fill="#17140f"><tspan font-weight="800">1</tspan>  COVER rule met → seen</text><circle cx="493.2" cy="88" r="7" fill="#17140f"/><text x="493.2" y="91" font-size="8.5" font-family="'JetBrains Mono', Menlo, monospace" font-weight="800" fill="#fcfbf6" text-anchor="middle">1</text><line x1="558" y1="96" x2="558" y2="360" stroke="#17140f" stroke-width="0.8" stroke-dasharray="2 2"/><text x="450" y="416" font-size="9" font-family="'JetBrains Mono', Menlo, monospace" fill="#17140f"><tspan font-weight="800">2</tspan>  p ≥ FILL_P for COVER_FRAMES → filled</text><circle cx="558" cy="88" r="7" fill="#17140f"/><text x="558" y="91" font-size="8.5" font-family="'JetBrains Mono', Menlo, monospace" font-weight="800" fill="#fcfbf6" text-anchor="middle">2</text><line x1="666" y1="96" x2="666" y2="360" stroke="#17140f" stroke-width="0.8" stroke-dasharray="2 2"/><text x="450" y="432" font-size="9" font-family="'JetBrains Mono', Menlo, monospace" fill="#17140f"><tspan font-weight="800">3</tspan>  p dips: no un-fill (predicted never lowers)</text><circle cx="666" cy="88" r="7" fill="#17140f"/><text x="666" y="91" font-size="8.5" font-family="'JetBrains Mono', Menlo, monospace" font-weight="800" fill="#fcfbf6" text-anchor="middle">3</text><line x1="745.2" y1="96" x2="745.2" y2="360" stroke="#17140f" stroke-width="0.8" stroke-dasharray="2 2"/><text x="450" y="448" font-size="9" font-family="'JetBrains Mono', Menlo, monospace" fill="#17140f"><tspan font-weight="800">4</tspan>  still processed: measured no-text → closer-look mark</text><circle cx="745.2" cy="88" r="7" fill="#17140f"/><text x="745.2" y="91" font-size="8.5" font-family="'JetBrains Mono', Menlo, monospace" font-weight="800" fill="#fcfbf6" text-anchor="middle">4</text><text x="450" y="474" font-size="9" font-family="'JetBrains Mono', Menlo, monospace" fill="#574f44">A rung goes down only on a measured event with a cause</text><text x="450" y="488" font-size="9" font-family="'JetBrains Mono', Menlo, monospace" fill="#574f44">(outcome-measured, re-anchor, model-change, new-session),</text><text x="450" y="502" font-size="9" font-family="'JetBrains Mono', Menlo, monospace" fill="#574f44">and then shows as a closer-look mark, never as hatching.</text>
</svg>
