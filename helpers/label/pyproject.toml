[project]
name = "bookcase-label"
version = "0.1.0"
description = "F-0 machine labelling: Grounding DINO -> SAM 2.1 spine boxes, PP-OCRv5 and Qwen3-VL readers (local, open weights)."
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.8",
  "torchvision>=0.23",
  "transformers>=4.57",
  "pillow>=11",
  "numpy>=2",
  "mlx-vlm>=0.3.9",
  "paddlepaddle>=3.2",
  "paddleocr>=3.3",
]

[tool.uv]
package = false
# paddlex needs opencv-contrib-python 4.10 and another dependency pulls opencv-python 5; both write the same
# cv2 package, so pin them to one version or cv2 fails to import.
override-dependencies = ["opencv-python==4.10.0.84", "opencv-contrib-python==4.10.0.84"]
